<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYNQ | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================
           BODY
        ========================================= */

        body {
            min-height: 100vh;

            background:
                radial-gradient(circle at 15% 15%,
                    rgba(124, 58, 237, 0.16),
                    transparent 32%),
                radial-gradient(circle at 85% 85%,
                    rgba(168, 85, 247, 0.10),
                    transparent 30%),
                #050505;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 28px;

            overflow: hidden;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;
            max-width: 1320px;

            min-height: 720px;

            display: grid;

            grid-template-columns: 1.05fr 0.95fr;

            background: rgba(10, 10, 10, 0.96);

            border: 1px solid #272727;

            border-radius: 26px;

            overflow: hidden;

            box-shadow:
                0 0 80px rgba(124, 58, 237, 0.10);

            position: relative;

            z-index: 2;
        }


        /* =========================================
           LEFT BRAND SECTION
        ========================================= */

        .brand-section {

            position: relative;

            padding: 68px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            border-right: 1px solid #242424;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(124, 58, 237, 0.17),
                    transparent 38%),
                #070707;
        }


        /* =========================================
           REAL SYNQ LOGO
        ========================================= */

        .logo-area {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: flex-start;
        }


        .synq-logo {

            display: block;

            width: 280px;

            max-width: 100%;

            height: auto;

            object-fit: contain;

            object-position: left center;
        }


        /* =========================================
           BRAND CONTENT
        ========================================= */

        .brand-content {

            margin-top: 40px;
        }


        .brand-content h1 {

            font-size: clamp(65px,
                    9vw,
                    120px);

            line-height: 0.9;

            letter-spacing: -6px;

            font-weight: 900;

            background:
                linear-gradient(135deg,
                    #ffffff 20%,
                    #d8b4fe 48%,
                    #a855f7 72%,
                    #7c3aed);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .tagline {

            margin-top: 26px;

            color: #999;

            font-size: 14px;

            letter-spacing: 5px;

            text-transform: uppercase;

            font-weight: 500;
        }


        .brand-description {

            margin-top: 25px;

            max-width: 500px;

            color: #686868;

            font-size: 15px;

            line-height: 1.8;
        }


        .bottom-text {

            color: #414141;

            font-size: 10px;

            letter-spacing: 2.5px;
        }


        /* =========================================
           RIGHT LOGIN SECTION
        ========================================= */

        .login-section {

            padding: 70px 75px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #090909;
        }


        .login-box {

            width: 100%;

            max-width: 470px;
        }


        .login-box h2 {

            font-size: 38px;

            font-weight: 750;

            margin-bottom: 10px;

            color: #ffffff;
        }


        .subtitle {

            color: #747474;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 42px;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .input-group {

            margin-bottom: 24px;
        }


        .input-group label {

            display: block;

            margin-bottom: 10px;

            color: #bcbcbc;

            font-size: 13px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-wrapper input {

            width: 100%;

            height: 60px;

            padding: 0 18px;

            background: #0e0e0e;

            color: #ffffff;

            border: 1px solid #292929;

            border-radius: 11px;

            outline: none;

            font-size: 14px;

            transition: 0.25s ease;
        }


        .input-wrapper input::placeholder {

            color: #555;
        }


        .input-wrapper input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.10);
        }


        /* =========================================
           PASSWORD TOGGLE
        ========================================= */

        .password-toggle {

            position: absolute;

            right: 18px;

            top: 50%;

            transform: translateY(-50%);

            color: #777;

            cursor: pointer;

            font-size: 12px;

            user-select: none;

            transition: 0.2s;
        }


        .password-toggle:hover {

            color: #b084ff;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {

            width: 100%;

            height: 60px;

            margin-top: 10px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(135deg,
                    #7c3aed,
                    #9333ea);

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 10px 30px rgba(124, 58, 237, 0.22);
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 38px rgba(124, 58, 237, 0.35);
        }


        .login-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 9px;

            font-size: 13px;

            display: none;

            line-height: 1.5;
        }


        .message.error {

            display: block;

            color: #fca5a5;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid rgba(239, 68, 68, 0.20);
        }


        .message.success {

            display: block;

            color: #86efac;

            background:
                rgba(34, 197, 94, 0.08);

            border:
                1px solid rgba(34, 197, 94, 0.20);
        }


        /* =========================================
           CREATE ACCOUNT
        ========================================= */

        .register-link {

            text-align: center;

            margin-top: 30px;

            color: #666;

            font-size: 13px;
        }


        .register-link a {

            color: #a855f7;

            text-decoration: none;

            font-weight: 600;

            margin-left: 4px;
        }


        .register-link a:hover {

            color: #c084fc;
        }


        /* =========================================
           SECURITY
        ========================================= */

        .secure-text {

            text-align: center;

            margin-top: 38px;

            color: #3f3f3f;

            font-size: 10px;

            letter-spacing: 1.3px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 950px) {

            body {

                padding: 18px;

                overflow: auto;
            }


            .container {

                grid-template-columns: 1fr;

                min-height: auto;
            }


            .brand-section {

                min-height: 430px;

                padding: 45px;

                border-right: none;

                border-bottom: 1px solid #242424;
            }


            .login-section {

                padding: 50px 40px;
            }


            .synq-logo {

                width: 240px;
            }


            .brand-content h1 {

                font-size: 80px;
            }
        }


        @media (max-width: 600px) {

            .container {

                border-radius: 18px;
            }


            .brand-section {

                padding: 32px;

                min-height: 350px;
            }


            .login-section {

                padding: 40px 25px;
            }


            .synq-logo {

                width: 210px;
            }


            .brand-content h1 {

                font-size: 65px;

                letter-spacing: -4px;
            }


            .tagline {

                font-size: 10px;

                letter-spacing: 3px;
            }


            .login-box h2 {

                font-size: 30px;
            }
        }
    </style>

</head>


<body>


    <div class="container">


        <!-- =====================================
             LEFT SIDE
        ====================================== -->

        <div class="brand-section">


            <!-- ACTUAL SYNQ LOGO -->

            <div class="logo-area">

                <img src="{{ url_for('static', filename='css/images/synq-logo.png') }}" alt="SYNQ Logo"
                    class="synq-logo" onerror="this.style.display='none';">

            </div>


            <!-- BRAND CONTENT -->

            <div class="brand-content">

                <h1>SYNQ</h1>


                <div class="tagline">

                    PEOPLE · DATA · PERFORMANCE

                </div>


                <p class="brand-description">

                    AI-powered employee performance intelligence
                    for a smarter and more efficient workplace.

                </p>

            </div>


            <div class="bottom-text">

                SMART PEOPLE • SMARTER PERFORMANCE

            </div>


        </div>



        <!-- =====================================
             RIGHT SIDE
        ====================================== -->

        <div class="login-section">


            <div class="login-box">


                <h2>

                    Welcome back

                </h2>


                <div class="subtitle">

                    Sign in to continue to your SYNQ dashboard.

                </div>



                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- USERNAME -->

                    <div class="input-group">

                        <label for="username">

                            Username

                        </label>


                        <div class="input-wrapper">

                            <input type="text" id="username" placeholder="Enter your username" autocomplete="username"
                                required>

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">

                            Password

                        </label>


                        <div class="input-wrapper">

                            <input type="password" id="password" placeholder="Enter your password"
                                autocomplete="current-password" required>


                            <span class="password-toggle" onclick="togglePassword()">

                                Show

                            </span>

                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button type="submit" class="login-btn" id="loginBtn">

                        LOGIN

                    </button>


                </form>



                <!-- MESSAGE -->

                <div id="message" class="message"></div>



                <!-- CREATE ACCOUNT -->

                <div class="register-link">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">

                        Create account

                    </a>

                </div>



                <!-- SECURITY -->

                <div class="secure-text">

                    🔒 SECURE AUTHENTICATION

                </div>


            </div>


        </div>


    </div>



    <script>


        /* =========================================
           PASSWORD SHOW / HIDE
        ========================================= */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const toggle =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                toggle.textContent = "Hide";

            }

            else {

                password.type = "password";

                toggle.textContent = "Show";

            }

        }



        /* =========================================
           LOGIN
        ========================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const button =
                        document
                            .getElementById("loginBtn");


                    const message =
                        document
                            .getElementById("message");


                    /* Reset message */

                    message.className =
                        "message";

                    message.textContent =
                        "";


                    /* Disable button */

                    button.disabled = true;

                    button.textContent =
                        "SIGNING IN...";


                    try {


                        const response =
                            await fetch(
                                "{{ url_for('login_api') }}",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            password:
                                                password

                                        })

                                }
                            );



                        /* Try to parse JSON safely */

                        let data = {};

                        try {

                            data =
                                await response.json();

                        }

                        catch {

                            data = {};

                        }



                        /* =================================
                           LOGIN SUCCESS
                        ================================= */

                        if (response.ok) {


                            if (data.access_token) {

                                // Save login information
                                const token = data.access_token || data.token;

                                if (token) {
                                    localStorage.setItem(
                                        "synq_token",
                                        token
                                    );
                                }

                                if (data.username) {
                                    localStorage.setItem(
                                        "synq_username",
                                        data.username
                                    );
                                }

                                if (data.role) {
                                    localStorage.setItem(
                                        "synq_role",
                                        data.role
                                    );
                                }
                            }


                            message.className =
                                "message success";


                            message.textContent =
                                "Login successful. Opening SYNQ...";


                            setTimeout(
                                function () {

                                    window.location.href =
                                        "{{ url_for('dashboard') }}";

                                },
                                700
                            );


                        }


                        /* =================================
                           LOGIN ERROR
                        ================================= */

                        else {


                            message.className =
                                "message error";


                            message.textContent =
                                data.message ||
                                data.msg ||
                                "Invalid username or password.";


                            button.disabled = false;

                            button.textContent =
                                "LOGIN";

                        }

                    }


                    /* =================================
                       CONNECTION ERROR
                    ================================= */

                    catch (error) {


                        console.error(
                            "Login error:",
                            error
                        );


                        message.className =
                            "message error";


                        message.textContent =
                            "Unable to connect to server.";


                        button.disabled = false;

                        button.textContent =
                            "LOGIN";

                    }

                }
            );


    </script>


</body>

</html>
